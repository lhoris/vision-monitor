spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/PPWIRE}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME:ppwiredb1}
    password: ${DB_PASSWORD:ppwiredb123!@}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          fetch_size: 50
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    sql-migration-prefix: V
    sql-migration-suffixes: .sql

logging:
  level:
    root: INFO
    com.vision: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
