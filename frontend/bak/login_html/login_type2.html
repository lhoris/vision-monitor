<!DOCTYPE HTML>
<html lang="ko">
    <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>POSCO 4선재 AI영상통합플랫폼</title>
    <link rel="stylesheet" type="text/css" href="css/login_style2.css">
    <link rel="stylesheet" type="text/css" href="css/XEIcon-2.2.0/xeicon.min.css">
</head>
<body>

    <div class="login-container login-type2">
        <div class="left-section" id="leftSection">
            <canvas id="webgl-canvas"></canvas>

            <div class="hero-text fade-left-unique" style="--delay: 0.2s;">
                <h1><img src="img/posco_logo_w.svg" alt=""><br><span>포항 4선재<br>AI 영상통합 플랫폼</span></h1>
                <p>Real-time CCTV Vision AI & Safety Monitoring Control</p>
            </div>
        </div>

        <!-- 오른쪽 영역 -->
        <div class="right-section">
            <div class="login-header fade-up-sequential" style="--delay: 0.3s;">
                <div class="login-text">
                    <span>L</span>
                    <div class="eye-o" id="eyeContainer">
                        <span class="letter-o">o</span>
                        <div class="eyes-wrapper">
                            <div class="eyeball-container">
                                <div class="eyeball" data-eye></div>
                            </div>
                            <div class="eyeball-container">
                                <div class="eyeball" data-eye></div>
                            </div>
                        </div>
                    </div>
                    <span>gin</span>
                </div>
                <p>모니터링 및 AI 관제를 위해 로그인 하시기 바랍니다.</p>
            </div>

            <form class="login-form" onsubmit="event.preventDefault();">
                <!-- 아이디 입력 그룹 -->
                <div class="input-group fade-up-sequential" style="--delay: 0.5s;">
                    <label>USER ID</label>
                    <input type="text" placeholder="ID" required>
                </div>

                <!-- 비밀번호 입력 그룹 -->
                <div class="input-group fade-up-sequential" style="--delay: 0.65s;">
                    <label>PASSWORD</label>
                    <input type="password" placeholder="Password" required>
                </div>

                <!-- 옵션 -->
                <div class="form-options fade-up-sequential" style="--delay: 0.8s;">
                    <label class="remember-me">
                        <input type="checkbox"> 아이디 저장
                    </label>
                </div>

                <!-- 로그인 버튼 -->
                <button type="submit" class="sign-in-btn fade-up-sequential" style="--delay: 0.95s;">로그인</button>
            </form>

            <!-- 하단 시스템 상태바 -->
            <div class="login-footer fade-up-sequential" style="--delay: 1.1s;">
                <div class="system-status-bar">
                    <div class="status-item">
                        <span>AI VISION SERVER</span>
                        <span class="status-dot">● ONLINE</span>
                    </div>
                    <div class="status-item">
                        <span>CCTV STREAMING HUB</span>
                        <span class="status-dot-warn">● 4선재 라인 연동중</span>
                    </div>
                    <div class="status-item">
                        <span>SERVER TIME</span>
                        <span id="server-time">2026-09-15 14:20:00 KST</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

<!-- 통합 스크립트 기능 -->
<script>

    // Canvas 배경 애니메이션 (웨이브 및 원형 그라데이션)
    const canvas = document.getElementById('webgl-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('leftSection');

    function resizeCanvas() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let step = 0;

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        step += 0.015;

        // 웨이브 라인 그리기
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.lineWidth = 1.2;
            
            if (i === 0) ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
            else if (i === 1) ctx.strokeStyle = 'rgba(129, 140, 248, 0.15)';
            else ctx.strokeStyle = 'rgba(52, 211, 153, 0.12)';

            const amplitude = 40 + i * 20;
            const frequency = 0.003 + i * 0.001;
            const speed = step * (1 + i * 0.3);

            for (let x = 0; x <= canvas.width; x += 10) {
                let y = (canvas.height / 2) + Math.sin(x * frequency + speed) * amplitude * Math.cos(step * 0.5);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        // 움직이는 그라데이션 원형 효과
        const time = Date.now() * 0.0008;
        for (let i = 0; i < 4; i++) {
            let px = (Math.sin(time + i) * 0.4 + 0.5) * canvas.width;
            let py = (Math.cos(time * 0.7 + i) * 0.4 + 0.5) * canvas.height;
            
            let gradient = ctx.createRadialGradient(px, py, 0, px, py, 180);
            gradient.addColorStop(0, 'rgba(56, 189, 248, 0.07)');
            gradient.addColorStop(1, 'rgba(56, 189, 248, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(px, py, 180, 0, Math.PI * 2);
            ctx.fill();
        }

        requestAnimationFrame(animate);
    }

    animate();

    // 마우스 커서 추적 눈동자(Eyeball) 인터랙션
    const eyeballs = document.querySelectorAll('[data-eye]');

    window.addEventListener('mousemove', (e) => {
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        eyeballs.forEach(eyeball => {
            const rect = eyeball.getBoundingClientRect();
            const eyeX = rect.left + rect.width / 2;
            const eyeY = rect.top + rect.height / 2;

            const angle = Math.atan2(mouseY - eyeY, mouseX - eyeX);
            const maxRadius = 6; 
            const distance = Math.min(maxRadius, Math.hypot(mouseX - eyeX, mouseY - eyeX) / 6);

            const moveX = Math.cos(angle) * distance;
            const moveY = Math.sin(angle) * distance;

            eyeball.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    });


    // SERVER TIME 실시간 시계 기능 (KST 기준)

    function updateServerTime() {
        const timeElement = document.getElementById('server-time');
        if (!timeElement) return;

        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        timeElement.textContent = `${year}-${month}-${day} ${hours}:${minutes}:${seconds} KST`;
    }

    // 페이지 로드 시 즉시 실행 및 1초 간격 반복 갱신
    updateServerTime();
    setInterval(updateServerTime, 1000);
</script>
</body>
</html>
