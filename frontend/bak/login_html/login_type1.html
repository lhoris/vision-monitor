<!DOCTYPE HTML>
<html lang="ko">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>POSCO 4선재 AI영상통합플랫폼</title>
    <link rel="stylesheet" type="text/css" href="css/login_style1.css">
    <link rel="stylesheet" type="text/css" href="css/XEIcon-2.2.0/xeicon.min.css">
</head>
    <body>
        <section class="login-wrap">            
            <div class="content-wrap">  
                <div class="imgWrap">
                    <div class="bg">                     
                        <div class="video pc-view">
                            <video autoplay muted loop>                       
                                <source src="img/login_video.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>             
                <div class="formWrap">
                    <div class="page-tab">
                        <h1><img src="img/posco_logo.svg" alt=""></h1>     
                        <h2>4선재 AI영상통합플랫폼</h2>                 
                    </div>
                    <div class="tab-content">
                        <div class="tab-pane fade active show">
                            <form method="POST" id="Login" name="Login">
                                <div class="row">                                     
                                    <div class="form-group id">
                                        <input type="text" class="form-control" id="USR_ID" name="ID" placeholder=" ">     
                                        <label for="USR_ID">ID</label>
                                        <i class="xi-user-o"></i>  
                                    </div>                                    
                                    <div class="form-group pw">
                                        <input type="password" class="form-control" id="PW" name="PW" placeholder=" " value=""> 
                                        <label for="PW">Password</label>
                                        <i class="xi-lock-o"></i>
                                    </div>     
                                    <div class="form-group">
                                        <div class="checkbox-wrap">
                                            <div class="form-check">
                                                <input type="checkbox" id="remember" class="form-check-input">                                                           
                                                <label for="remember" class="form-check-label">                                           
                                                    아이디저장
                                                </label>
                                            </div>
                                            <a href="#" class="switcher-text">아이디/패스워드 찾기</a>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <button type="submit" class="btn-fill"><span>Login</span></button>
                                    </div>
                                </div>
                                <div class="footer">
                                    <span>POSCO Smart Factory / AI Video Platform</span>
                                </div>
                            </form>
                        </div>
                    </div>                      
                </div>                
            </div>      
        </section>
    </body>
</html>
