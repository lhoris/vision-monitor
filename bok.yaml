bok_version: "0.1.0"
project: vision-monitor
language: en
bounded_contexts:
  - id: core

staleness:
  reference_days: 90
  explanation_days: 180
  glossary_days: 180

confidence:
  cross_support_requires_distinct_kinds: true

readiness:
  criticality_weights: {critical: 4, high: 3, normal: 2, low: 1}
  required_confidence: {critical: verified, high: corroborated, normal: inferred}
  tier_thresholds: {R3_score: 80}
  purpose_to_tier: {understand: R2, feature: R3, modernization: R4}

adversarial:
  max_rounds: 3

packs:
  - source: core

coverage_template: arc42+tdd

# Report settings (v0.3.0+)
report:
  drilldown_mode: relative  # Options: relative (default/offline), vscode, github
  # repo_root: /absolute/path/to/repo  # Required for vscode mode (auto-detected from .git if absent)
  # github_base: https://github.com/org/repo  # Required for github mode
